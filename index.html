<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7fc5ee">
<title>Colonia</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Colonia">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Patrick+Hand&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="crayon"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter>
  <defs>
    <pattern id="rayas" width="22" height="10" patternUnits="userSpaceOnUse"><rect width="11" height="10" fill="#f6a38f"/><rect x="11" width="11" height="10" fill="#fff6e6"/></pattern>
    <pattern id="rayas2" width="16" height="10" patternUnits="userSpaceOnUse"><rect width="8" height="10" fill="#a9d6f0"/><rect x="8" width="8" height="10" fill="#fff6e6"/></pattern>
    <pattern id="rayas3" width="12" height="10" patternUnits="userSpaceOnUse"><rect width="6" height="10" fill="#f7b3c6"/><rect x="6" width="6" height="10" fill="#fff6e6"/></pattern>
  </defs>
</svg>
<div id="sky" aria-hidden="true"></div>
<main id="app"><div id="screen"></div></main>
<nav class="tabs" id="tabs" hidden></nav>
<div id="toasts" aria-live="polite"></div>
<input type="file" id="file" accept="image/*" hidden>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/sky.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
